{% if site.enable_progressbar %}
<script>
(() => {
  const progress = document.getElementById('progress');
  const navbar = document.getElementById('navbar');
  const updateScroll = () => { progress.value = window.scrollY; };
  const updateRange = () => {
    const navbarHeight = navbar.getBoundingClientRect().height;
    document.body.style.paddingTop = `${navbarHeight}px`;
    progress.style.top = `${navbarHeight}px`;
    progress.max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    updateScroll();
  };
  const layoutObserver = new ResizeObserver(updateRange);
  layoutObserver.observe(document.body);
  layoutObserver.observe(navbar);
  window.addEventListener('resize', updateRange);
  window.addEventListener('scroll', updateScroll, {passive: true});
})();
</script>
{% endif %}
