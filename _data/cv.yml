- title: Research Experience
  type: time_table
  contents:
  - title: Research Intern
    institution: Shanghai AI Laboratory
    year: 2025–Present
    location: Shanghai, China
    maindescription: Core member of the multi-step retrosynthesis planning project.
    description:
    - Jul 2025 — Present
    - Designed AOT*, integrating LLM-generated routes with AND-OR tree search, retrieval,
      reward assignment, and multi-level reaction verification.
    - Developed RetroGEF for single-step retrosynthesis with dynamic graph edit generation.
    - Contributed to RIGS, Latent JEPA, and MolEmb, covering controllable generation,
      latent chemical reasoning, and molecular representations.
    - Integrated template retrieval, candidate generation, multi-step search, and
      the MoSyn route evaluation framework.
  - title: Research Intern
    institution: Shanghai AI Laboratory
    year: 2024–2025
    location: Shanghai, China
    maindescription: Research on language model reasoning over structured knowledge.
    description:
    - Dec 2024 — Feb 2025
    - Designed ReKG-MCTS, a training-free reasoning framework combining language
      models with Monte Carlo tree search (Findings of ACL 2025).
    - Modeled reasoning as sequential decisions with UCB selection, path expansion,
      LLM-guided rollout, and value backpropagation.
  - title: Research Intern · Machine Learning Area
    institution: Microsoft Research Asia
    year: 2021–2023
    location: Beijing, China
    maindescription: 'Mentors: Shun Zheng and Jiang Bian.'
    description:
    - Jun 2021 — Jun 2023
    - Proposed meta-learning on task combinations for efficient multi-task grouping
      (NeurIPS 2022).
    - Participated in prototype-based tabular representation learning via space calibration
      (ICLR 2024 Spotlight).
    - Contributed a dynamic programming and imitation learning approach to the NeurIPS
      2022 CityLearn Challenge, placing fifth.
- title: Research Interests
  type: nested_list
  contents:
  - title: Representation
    items:
    - Learning useful representations of tabular, temporal, graph, and molecular data,
      through multi-task learning, space calibration, and multimodal embedding.
  - title: Generation
    items:
    - Modeling graph edits and molecular geometry with diffusion and flow-based methods,
      from conformer generation and fluid dynamics to single-step retrosynthesis.
  - title: Reasoning & planning
    items:
    - Combining LLMs with explicit graph and tree structures to explore reasoning
      paths, reuse intermediate results, and build executable synthesis routes.
